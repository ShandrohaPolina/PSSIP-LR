<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №18</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(to right, #ffffff 0%, #ae57ff 100%);
            color: #000000;
            max-width: 750px;
            margin: 0 auto;
            padding: 30px;
        }

        .form-cont {
            background-color: rgb(255, 255, 255);
            padding: 20px;
            border: 4px solid #f7cbff;
            border-radius: 8px;
            box-shadow: 30px 0px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #510250;
            margin-bottom: 40px;
            font-size: 30px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #1c002d;
            font-size: 16px;
        }

        input,
        select,
        textarea {
            width: 100%;
            border-radius: 4px;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 2px solid #e5c9eb;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #7b00c7;
            box-shadow: 0 0 0 5px rgba(74, 0, 224, 0.1);
            outline: none;
        }

        .checkbox-group,
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 35px;
        }

        .checkbox-item,
        .radio-item {
            display: flex;
            align-items: center;
        }

        .checkbox-item input,
        .radio-item input {
            width: auto;
            margin-right: 6px;
        }

        button {
            background-color: #b54eff;
            color: white;
            padding: 10px 15px;
            border: none;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.5s;
            cursor: pointer;
            /* margin-bottom: 10px; */
        }

        button:hover {
            background-color: #7513c1;
        }

        .error {
            color: red;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }

        #formResults {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 4px;
            border-left: 4px solid #4CAF50;
            display: none;
        }

        .required::after {
            content: " *";
            color: red;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .failure {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="form-cont">
        <h2>Форма регистрации</h2>
        <form id="userForm" novalidate>
            <div class="form-group">

                <label for="fullName" class="required" minlength="2" maxlength="80">Фамилия Имя Отчество:</label>
                <input type="text" id="fullName" name="fullName" required
                    pattern="[А-ЯЁа-яё]+\s[А-ЯЁа-яё]+\s[А-ЯЁа-яё]+" title="Введите Фамилию Имя Отчество через пробел">
                <div class="error" id="fullNameError"></div>
            </div>

            <div class="form-group">
                <label for="email" class="required">Email:</label>
                <input type="email" id="email" name="email" required>
                <div class="error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="phone" class="required">Контактный телефон:</label>
                <input type="tel" id="phone" name="phone" required pattern="\+375\(\d{2}\)\d{3}-\d{2}-\d{2}"
                    placeholder="+375(XX)XXX-XX-XX">
                <div class="error" id="phoneError"></div>
            </div>

            <div class="form-group">
                <label class="required">Ваш возраст:</label>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="age1" name="age" value="18-25" required>
                        <label for="age1">18-25</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="age2" name="age" value="26-35">
                        <label for="age2">26-35</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="age3" name="age" value="36-45">
                        <label for="age3">36-45</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="age4" name="age" value="45+">
                        <label for="age4">45+</label>
                    </div>
                </div>
                <div class="error" id="ageError"></div>
            </div>

            <div class="form-group">
                <label>Ваши хобби:</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="sport" name="interests" value="sport">
                        <label for="sport">Спорт</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="music" name="interests" value="music">
                        <label for="music">Музыка</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="books" name="interests" value="books">
                        <label for="books">Чтение</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="travel" name="interests" value="travel">
                        <label for="travel">Путешествия</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="noth" name="interests" value="noth">
                        <label for="noth">А вам то что???</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="country">Страна</label>
                <select id="country" name="country">
                    <option value="">Выберите страну</option>
                    <option value="ru">Россия</option>
                    <option value="kz">Казахстан</option>
                    <option value="by">Беларусь</option>
                    <option value="other">Другая</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comments">Комментарий</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Вам есть что сказать?"></textarea>
            </div>

            <div class="buttons">
                <button type="submit" class="submit-btn">Отправить данные</button>
                <button type="reset" class="reset-btn">Очистить форму</button>
            </div>

            <!-- Результаты формы -->
            <div id="formResults">
                <h3>Данные формы:</h3>
                <div id="resultsContent"></div>
            </div>

            <!-- Задание 3: Работа с регулярными выражениями -->
            <div class="regex-section">
                <h2>Работа с регулярными выражениями</h2>

                <div class="form-group">
                    <label for="regexTest">Введите текст для проверки регулярными выражениями:</label>
                    <input type="text" id="regexTest" placeholder="Пример: test@example.com или +375(29)123-45-67">
                </div>

                <div class="buttons">
                    <button type="button" id="testEmailBtn" class="submit-btn">Проверить email</button>
                    <button type="button" id="testPhoneBtn" class="submit-btn">Проверить телефон</button>
                    <button type="button" id="testWordsBtn" class="submit-btn">Найти слова</button>
                </div>

                <div class="regex-test">
                    <div class="regex-result" id="regexResult"></div>
                </div>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>

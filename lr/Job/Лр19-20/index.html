<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOMETRICA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
        }

        header {
            background: linear-gradient(180deg, #dadada, #8707cc);
            color: white;
            padding: 2rem 0;
            text-align: center;
        }

        .container {
            max-width: 1450px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .main-content {
            display: flex;
            gap: 20px;
            margin: 30px 0;
        }

        .catalog {
            flex: 5;
            /* !!!!!! 
            flex: 3*/
        }

        .cart {
            flex: 1;
            background-color: rgb(247, 247, 247);
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        h2 {
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: white;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            border: 1px solid #ccc;
        }

        .product-card:hover {
            box-shadow: 10px 10px 25px rgb(89, 0, 255),
                -10px -10px 25px #8707cc,
                0 0 25px rgb(146, 146, 146);
        }

        .product-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 18px;
            margin-bottom: 10px;
            color: #2a2a2a;
            font-weight: 600;
        }

        .product-description {
            color: #666;
            font-size: 14px;
            flex-grow: 1;
        }

        .product-details {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 12px;
            color: #7f8c8d;
        }

        .product-price {
            font-weight: bold;
            color: #3d0061;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .add-to-cart {
            background-color: rgba(255, 218, 218, 1);
            color: rgba(243, 79, 79, 1);
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-to-cart:hover {
            background-color: rgba(243, 79, 79, 1);
            color: rgba(255, 218, 218, 1);

        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #cccccc;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .cart-item-price {
            color: rgba(243, 79, 79, 1);
            font-size: 0.9rem;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            background-color: #f0f0f0;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .quantity-btn:hover {
            background-color: #c6c6c6;
        }

        .cart-total {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: right;
        }

        .checkout-btn {
            background-color: rgba(243, 79, 79, 1);
            color: rgba(255, 218, 218, 1);
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            margin-top: 15px;
            transition: background-color 0.3s;
            font-weight: 600;
        }

        .checkout-btn:hover:not(:disabled) {
            background-color: rgba(255, 218, 218, 1);
            color: rgba(243, 79, 79, 1);
        }

        .checkout-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        .empty-cart {
            text-align: center;
            color: #888;
            padding: 30px 0;
        }

        .empty-cart i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }

            .cart {
                position: static;
                max-height: none;
            }

            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="container">
            <h1>GEOMETRICA</h1>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <section class="catalog">
                <h2>Каталог товаров</h2>
                <div class="product-grid" id="productGrid">
                    <!-- Товары будут загружены через JavaScript -->
                </div>
            </section>

            <aside class="cart">
                <h2>Корзина</h2>
                <div id="cartItems">
                    <!-- Элементы корзины будут загружены через JavaScript -->
                </div>
                <div class="cart-total" id="cartTotal">
                    Итого: 0 Br
                </div>
                <button class="checkout-btn" id="checkoutBtn">Оформить заказ</button>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Персональные данные</title>
    <style>
        body {
            font-family: 'Segoe UI', Verdana, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            background-color: #b2a0c5;
            color: #222121;
        }

        .form-cont {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.321);
        }

        h2 {
            background-color: #c098ea;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #c098ea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(163, 74, 165, 0.2);
        }

        button {
            background-color: #c098ea;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            width: 48%;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s;
            cursor: pointer;
            margin-right: 4%;
        }

        button:hover {
            background-color: #b2a0c5;
        }

        button:last-child {
            margin-right: 0;
        }

        .error {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }

        #output {
            margin-top: 30px;
            padding: 20px;
            background-color: #b2a0c5;
            border-radius: 8px;
        }

        .required::after {
            content: " *";
            color: #dc3545;
        }

        .buttons-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="form-cont">
        <h2>Персональные данные</h2>
        <form id="personalForm">
            <div class="form-group">
                <label for="fullName" class="required">ФИО:</label>
                <input type="text" id="fullName" name="fullName" placeholder="Иванов Иван Иванович">
                <div class="error" id="fullNameError"></div>
            </div>

            <div class="form-group">
                <label for="email" class="required">Электронная почта:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com">
                <div class="error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="birthDate" class="required">Дата рождения:</label>
                <input type="date" id="birthDate" name="birthDate">
                <div class="error" id="birthDateError"></div>
            </div>

            <div class="form-group">
                <label for="birthPlace" class="required">Место рождения:</label>
                <input type="text" id="birthPlace" name="birthPlace" placeholder="Город, страна">
                <div class="error" id="birthPlaceError"></div>
            </div>

            <div class="form-group">
                <label for="hobbies">Увлечения:</label>
                <textarea id="hobbies" name="hobbies" rows="4" placeholder="Ваши хобби и интересы"></textarea>
            </div>
            <div class="buttons-container">
                <button type="submit">Сохранить</button>
                <button type="button" id="clearForm">Очистить форму</button>
                <button type="button" id="clearStorage">Очистить хранилище</button>
            </div>
        </form>

        <div id="output">
            <h3>Данные из хранилища:</h3>
            <p id="storageData">Нет сохраненных данных</p>
        </div>
    </div>

    <script src="scri.js"></script>
</body>

</html>
